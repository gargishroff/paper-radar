[project]
name = "paper-radar"
version = "0.1.0"
description = "A personal arXiv recommender: Embed 4 retrieval, Rerank 4, learned ranking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.11.3",
    "cohere>=5.15",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "numpy>=2.5.3",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pylatexenc>=2.11",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
